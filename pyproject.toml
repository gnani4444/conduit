[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conduit"]
exclude = ["Design", "tests", "examples", "seed_data.py", "task-tracker.md", "docker-compose.yml"]

[tool.hatch.build.targets.sdist]
exclude = ["Design", ".venv", "dist"]

[project]
name = "conduit-ai-agents"
version = "0.1.1"
requires-python = ">=3.11"
description = "Cross-framework AI agent observability and reliability shim"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["ai", "agents", "observability", "opentelemetry", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "jsonschema>=4.22.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
langgraph = ["langgraph>=1.0.0", "langsmith>=0.1.0"]
openai = ["openai-agents>=0.0.14"]
crewai = ["crewai>=0.80.0"]

[project.scripts]
conduit = "conduit.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
